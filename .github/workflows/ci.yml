# Typecheck + lint + unit tests + production build against a migrated Postgres 17.
# Render deploys `main` only after this passes (autoDeployTrigger: checksPass).
name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: komputy }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      # CI-only placeholders: the build validates that every required variable is present.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/komputy
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      IP_HASH_SALT: ci-only-salt-0123456789
      CRON_SECRET: ci-only-cron-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: "Migrations apply to an empty database, twice (idempotent)"
        run: npm run db:migrate && npm run db:migrate
      - uses: actions/cache@v4
        with: { path: .next/cache, key: "next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}", restore-keys: "next-${{ hashFiles('package-lock.json') }}-" }
      - run: npm run check
