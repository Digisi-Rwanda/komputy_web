# Typecheck + lint + unit tests + production build against a migrated Postgres 17.
# Render deploys `main` only after this passes (autoDeployTrigger: checksPass).
name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: komputy }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      # CI-only placeholders: the build validates that every required variable is present.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/komputy
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      IP_HASH_SALT: ci-only-salt-0123456789
      CRON_SECRET: ci-only-cron-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: "Naming and punctuation guard: no em/en dashes, no pre-rebrand names"
        run: |
          if git grep -nI -e $'\u2014' -e $'\u2013' -e 'Ledgerline' -e 'ECL Platform' -- . ':!*.lock' ':!package-lock.json' ':!uv.lock' ':!design/**' ':!.github/**'; then
            echo "Found em/en dashes or old product names (see docs/REBRAND_PLAN.md in komputy_server)"; exit 1
          fi
      - name: "Surface guard: no glass, blur or see-through panels (docs/POLISH_PLAN.md)"
        run: |
          if git grep -nIE '\bglass\b|backdrop-(blur|filter)|bg-(canvas|canvas-deep|surface|raised|overlay|sidebar)/[0-9]+' -- src; then
            echo "Panels must be solid: use bg-canvas, bg-raised or bg-surface-hover"; exit 1
          fi
      - name: "Light only guard: no dark mode or theme switching (docs/LIGHT_ONLY_PLAN.md)"
        run: |
          if git grep -nIE 'data-theme|prefers-color-scheme|toggleTheme|ThemeToggle|color-scheme: ?dark' -- src; then
            echo "Komputy has one light theme: remove the dark mode or theme switch code"; exit 1
          fi
      - name: "Contrast: every text and signal colour pair passes WCAG"
        run: node scripts/contrast-check.mjs
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: "Migrations apply to an empty database, twice (idempotent)"
        run: npm run db:migrate && npm run db:migrate
      - uses: actions/cache@v4
        with: { path: .next/cache, key: "next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}", restore-keys: "next-${{ hashFiles('package-lock.json') }}-" }
      - run: npm run check
